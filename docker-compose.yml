services:
  postgres:
    image: postgres:16-alpine
    container_name: quantlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantlab
      POSTGRES_USER: quantlab
      POSTGRES_PASSWORD: quantlab_dev_password
    ports:
      - "5432:5432"
    volumes:
      - quantlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlab -d quantlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quantlab_pgdata:
