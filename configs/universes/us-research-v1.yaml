universe_id: US-RESEARCH-v1
version: v1
description: >-
  Sector-diverse US listed universe used for engine validation. Names are chosen for
  long continuous history, sector spread, and for the corporate-action and regime edge
  cases the engine needs to be exercised against - not because they are expected to be
  profitable. ETFs are listed separately and are never mixed into the equity
  cross-section (spec 2.7); they exist as benchmarks and allocation sleeves.

# Known and deliberate limitation: every name below is still listed today. Free data
# providers do not carry delisted price history, so any study built on this universe
# carries survivorship bias. The synthetic fixture is the one that exercises delisting
# and merger handling. Do not read a backtest on this universe as survivorship free.
survivorship_bias: PRESENT
survivorship_note: >-
  Currently-listed constituents only. Failed and acquired companies from the study
  window are absent, which biases realized returns upward.

