name: QuantLab CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Run offline M0.1 checks
        env:
          QUANTLAB_OFFLINE: "1"
        run: python -m pytest tests/test_scope_guard.py tests/test_milestone_gates.py -q

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy quantlab apps

      - name: Enforce M0 scope
        run: python scripts/check_scope.py M0

      - name: Validate Docker Compose when configured
        run: |
          if [ -f docker-compose.yml ] || [ -f docker-compose.yaml ]; then
            docker compose config --quiet
          else
            echo "Docker Compose validation deferred until Task M0.4 creates its configuration."
          fi
